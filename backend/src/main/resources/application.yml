spring:
  application:
    name: Agenzia Immobiliare
  
  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/agenzia_immobiliare
    username: agenzia_user
    password: agenzia_pass123
    driver-class-name: org.postgresql.Driver
  
  # Flyway Configuration
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# Logging
logging:
  level:
    root: INFO
    it.polimi.agenzia: DEBUG
    org.springframework.security: DEBUG

# JWT Configuration
jwt:
  secret: your-super-secret-key-change-this-in-production-with-environment-variable
  expiration: 86400000 # 24 hours in milliseconds


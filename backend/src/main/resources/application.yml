spring:
  application:
    name: Agenzia Immobiliare

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/agenzia_immobiliare
    username: agenzia_user
    password: agenzia_pass123
    driver-class-name: org.postgresql.Driver
  
  # Flyway Configuration
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# Logging
logging:
  level:
    root: INFO
    it.polimi.agenzia: DEBUG
    org.springframework.security: DEBUG

# JWT Configuration
jwt:
  secret: your-super-secret-key-change-this-in-production-with-environment-variable
  expiration: 86400000 # 24 hours in milliseconds

r2:
  bucket-name: ${R2_BUCKET_NAME}
  endpoint: ${R2_ENDPOINT}
  public-url: ${R2_PUBLIC_URL}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}

version: '3.8'

services:
  # Database PostgreSQL
  postgres:
    image: postgres:14-alpine
    container_name: agenzia_postgres
    environment:
      POSTGRES_DB: agenzia_immobiliare
      POSTGRES_USER: agenzia_user
      POSTGRES_PASSWORD: agenzia_pass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenzia_user -d agenzia_immobiliare"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agenzia_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agenzia_immobiliare
      SPRING_DATASOURCE_USERNAME: agenzia_user
      SPRING_DATASOURCE_PASSWORD: agenzia_pass123
      JWT_SECRET: mondo-immobiliare-local-development-secret-key-2026-super-lunga-sicura-per-hs512-token-jwt
      JWT_EXPIRATION: 86400000
      R2_BUCKET_NAME: ilmondoimmobiliare-images
      R2_ENDPOINT: https://e8f774d754d904f08d1cf022460ad9a7.r2.cloudflarestorage.com
      R2_PUBLIC_URL: https://pub-37c7fcaa3c6949a297c872ab66cb7d53.r2.dev
      R2_ACCESS_KEY_ID: 782b724bf31d5427aaeea7d0755922ae
      R2_SECRET_ACCESS_KEY: e52232e09348efc60905f4376c60e0a45ed3d867ee9a48ff5ac3afcaa17cdde3
    ports:
      - "8080:8080"
    volumes:
      - uploaded_images:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agenzia_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploaded_images: